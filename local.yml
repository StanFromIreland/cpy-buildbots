# Sets up a CPython buildbot worker on a Debian/Ubuntu machine
#
# Run on the machine itself via ansible-pull (see README.md). Per-machine
# settings come from machines/<hostname>.yml.

- name: CPython buildbot worker
  hosts: localhost
  connection: local
  become: true

  vars_files:
    - defaults.yml
    - "machines/{{ ansible_facts['hostname'] }}.yml"

  vars:
    worker_dir: "{{ base_dir }}/{{ worker_name }}"

  tasks:
    - name: Install buildbot-worker and CPython build dependencies
      ansible.builtin.apt:
        name: "{{ ['buildbot-worker', 'git', 'unattended-upgrades'] + build_deps + (extra_packages | default([])) }}"
        update_cache: true
        cache_valid_time: 3600
      register: apt_result
      retries: 5 # SpacemiT package mirrors can be flaky... :-(
      delay: 30
      until: apt_result is succeeded

    - name: Create configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/needrestart/conf.d
        - /etc/systemd/system/buildbot-worker@.service.d

    # Daily security and regular updates. Updates only get installed, so nothing
    # is rebooted.
    - name: Configure unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52buildbot
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-updates";
          };
          Unattended-Upgrade::Automatic-Reboot "false";

    # Where needrestart is installed, it restarts services after their
    # libraries are upgraded, which would kill a running build...
    - name: Stop needrestart from restarting the worker
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/buildbot-worker.conf
        mode: "0644"
        content: |
          $nrconf{override_rc}{qr(^buildbot-worker@)} = 0;

    - name: Ensure the worker password file exists
      ansible.builtin.stat:
        path: "{{ password_file }}"
      register: password_stat

    - name: Stop if's missing!
      ansible.builtin.fail:
        msg: >-
          {{ password_file }} not found. Put the worker password there and run again.
      when: not password_stat.stat.exists

    - name: Create the worker (first run only)
      ansible.builtin.shell: >
        runuser -u buildbot -- buildbot-worker create-worker
        {{ worker_dir | quote }} {{ master | quote }} {{ worker_name | quote }}
        "$(cat {{ password_file | quote }})"
      args:
        creates: "{{ worker_dir }}/buildbot.tac"

    - name: Add recommended buildbot.tac settings
      ansible.builtin.lineinfile:
        path: "{{ worker_dir }}/buildbot.tac"
        regexp: "^{{ item.key }} = "
        line: "{{ item.key }} = {{ item.value }}"
      loop:
        - { key: keepalive, value: 60 }
        - { key: delete_leftover_dirs, value: 1 }
        # On SIGHUP, finish the running build and then exit.
        - { key: allow_shutdown, value: "'signal'" }
      notify: Restart worker gracefully

    - name: Write the public info files
      ansible.builtin.copy:
        dest: "{{ worker_dir }}/info/{{ item.file }}"
        content: "{{ item.content }}\n"
        owner: buildbot
        group: buildbot
        mode: "0644"
      loop:
        - { file: admin, content: "{{ worker_admin }}" }
        - { file: host, content: "{{ worker_host_info }}" }
      notify: Restart worker gracefully

    # "reload" sends SIGHUP, which makes the worker exit once it is idle (see
    # allow_shutdown above). Restart=always then starts it again.
    - name: Make systemd restart the worker whenever it exits
      ansible.builtin.copy:
        dest: /etc/systemd/system/buildbot-worker@.service.d/graceful-restart.conf
        mode: "0644"
        content: |
          [Service]
          Restart=always
          RestartSec=10
          ExecReload=/bin/kill -HUP $MAINPID

    - name: Enable and start the worker
      ansible.builtin.systemd:
        name: "buildbot-worker@{{ worker_name }}"
        daemon_reload: true
        enabled: true
        state: started

    # Auto-deploy: re-run this playbook from the repository on a timer.
    # Skipped until repo_url is set in defaults.yml.
    - name: Install the auto-deploy service
      ansible.builtin.copy:
        dest: /etc/systemd/system/buildbot-deploy.service
        mode: "0644"
        content: |
          [Unit]
          Description=Apply buildbot worker configuration from {{ repo_url }}
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/ansible-pull -U {{ repo_url }} -C {{ repo_branch }}
      when: repo_url is defined

    - name: Install the auto-deploy timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/buildbot-deploy.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Periodically apply buildbot worker configuration

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec={{ deploy_interval }}
          RandomizedDelaySec=2min

          [Install]
          WantedBy=timers.target
      when: repo_url is defined

    - name: Enable the auto-deploy timer
      ansible.builtin.systemd:
        name: buildbot-deploy.timer
        daemon_reload: true
        enabled: true
        state: started
      when: repo_url is defined

  handlers:
    # Fires when buildbot.tac or the info files change. The worker tells the
    # master it wants to shut down, finishes any running build, exits, and
    # systemd starts it again. A worker that was started before allow_shutdown
    # was set dies immediately on the SIGHUP instead (one hard restart).
    - name: Restart worker gracefully
      ansible.builtin.systemd:
        name: "buildbot-worker@{{ worker_name }}"
        state: reloaded
